[project]
name = "geoguessr_utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier Levio", email = "javier.levio.silva@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "av>=19.0.2",
    "opencv-python>=5.0.0.93",
    "pytesseract>=0.3.13",
    "sqlmodel>=0.0.42",
]

[project.scripts]
gg-visualize = "geoguessr_utils.cli.visualize_rois:main"
gg-visualize-layout = "geoguessr_utils.cli.visualize_layout_rois:main"
gg-select-roi = "geoguessr_utils.cli.select_roi:main"
gg-extract = "geoguessr_utils.cli.extract_score:main"
gg-discover = "geoguessr_utils.cli.discover_screens:main"
gg-filter = "geoguessr_utils.cli.filter_screens:main"
gg-annotate-frames = "geoguessr_utils.cli.annotate_frames:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (auto-sort imports)
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
