[project]
name = "geoguessr_utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Javier Levio", email = "javier.levio.silva@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "opencv-python>=5.0.0.93",
    "pytesseract>=0.3.13",
    "sqlmodel>=0.0.42",
]

[project.scripts]
gg-extract = "geoguessr_utils.extract_score:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort (auto-sort imports)
    "B",  # flake8-bugbear
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
